[package]
name = "rinha-backend-2026"
version = "0.1.0"
edition = "2024"

[lib]
name = "rinha_backend_2026"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "build_artifacts"
path = "src/bin/build_artifacts.rs"

[[bin]]
name = "lb"
path = "src/bin/lb.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
flate2 = "1.1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
memmap2 = "0.9.9"
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt", "signal", "net", "io-util", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
