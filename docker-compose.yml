x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BUILD_CPU_PROFILE: "${BUILD_CPU_PROFILE:-generic}"
  platform: linux/amd64
  environment:
    PROBE_COUNT: "${PROBE_COUNT:-12}"
    LISTEN_MODE: tcp
    BIND_ADDR: 0.0.0.0:9999
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  lb:
    image: nginx:1.29-alpine
    platform: linux/amd64
    command: ["nginx", "-c", "/tmp/nginx.conf", "-g", "daemon off;"]
    ports:
      - "9999:9999"
    volumes:
      - ./lb/nginx.conf:/tmp/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "24MB"

  api1:
    <<: *api-common

  api2:
    <<: *api-common
