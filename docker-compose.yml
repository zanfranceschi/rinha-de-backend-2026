# docker-compose.yml — Rinha de Backend 2026
#
# Topologia:
#   - 1 nginx load balancer (port 9999)
#   - 2 API servers em C (port 8080 cada)
#   - Round-robin puro (sem inspecao de payload)
#
# Limites de recursos:
#   - nginx:       0.10 CPU, 10 MB RAM
#   - API 1:       0.45 CPU, 170 MB RAM
#   - API 2:       0.45 CPU, 170 MB RAM
#   TOTAL:         1.00 CPU, 350 MB RAM ✅
#
# Redes:
#   - bridge (nao host, nao privileged)
#
# Startup:
#   1. API 1 e 2 compilam (multi-stage: ~60s no Mac Mini)
#   2. Healthcheck espera /ready retornar 200 OK
#   3. nginx aguarda api1 e api2 estarem healthy
#   4. Porta 9999 aceita conexoes
#
# Teste local:
#   docker compose up --build
#   k6 run test/test.js
#   docker compose down

services:
  # =========================================================================
  # Load Balancer (nginx)
  # =========================================================================
  lb:
    image: nginx:alpine
    container_name: rinha-lb

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "9999:9999"

    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10MB"

    networks:
      - rinha

    restart: unless-stopped

  # =========================================================================
  # API Server 1
  # =========================================================================
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rinha-api-1

    environment:
      - PORT=8080
      - INDEX_PATH=/data/index.bin
      - WORKERS=3

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

    networks:
      - rinha

    restart: unless-stopped

  # =========================================================================
  # API Server 2
  # =========================================================================
  api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rinha-api-2

    environment:
      - PORT=8080
      - INDEX_PATH=/data/index.bin
      - WORKERS=3

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

    networks:
      - rinha

    restart: unless-stopped

# ============================================================================
# Network
# ============================================================================
networks:
  rinha:
    driver: bridge
