global
    nbthread 1
    maxconn 4096
    tune.bufsize 8192
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option dontlognull
    timeout connect 200ms
    timeout client 30s
    timeout server 2s
    timeout http-keep-alive 30s

frontend public_http
    bind :9999
    default_backend apis

backend apis
    balance roundrobin
    http-reuse always
    server api1 unix@/sockets/api1.sock
    server api2 unix@/sockets/api2.sock
