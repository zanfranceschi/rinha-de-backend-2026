# nginx.conf — Load Balancer para Rinha de Backend 2026
#
# Funcionalidade:
#   - Listen port 9999
#   - Round-robin puro entre api1:8080 e api2:8080
#   - NAO inspeciona payload (proxy_pass direto)
#   - Keepalive para reduzir overhead de conexao
#   - Sem logging para economizar I/O

events {
    worker_connections 2048;
    use epoll;
}

http {
    # Minima verbosidade
    access_log off;
    error_log /dev/null crit;

    # Upstream: round-robin entre as 2 APIs
    upstream api_backend {
        least_conn;
        server api1:8080 weight=1;
        server api2:8080 weight=1;
        keepalive 32;
    }

    # Server principal
    server {
        listen 9999 default_server;
        listen [::]:9999 default_server;
        server_name _;

        # Proxy settings
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;

        # Todas as rotas vao para upstream (round-robin)
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Headers para preservar info original
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffer settings para economia de memoria
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Health check endpoint (nao precisa de proxy)
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
